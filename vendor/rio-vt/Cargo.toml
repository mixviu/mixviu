[package]
name = "rio-vt"
version = "0.5.27"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
repository = "https://github.com/raphamorim/rio"
description = "Embeddable terminal core extracted from Rio: VT state machine, grid, PTY driver, selection, search"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
tracing = "0.1.41"
base64 = "0.23.0"
memchr = { version = "2.8.3", default-features = false }
bitflags = "2.9.0"
rustc-hash = "2.1.3"
regex = "1.12.3"
image_rs = { package = "image", version = "0.25.10", default-features = false, features = ["gif", "jpeg", "ico", "png", "pnm", "webp", "bmp", "tiff"], optional = true }
parking_lot = { version = "0.12.5", features = ["nightly", "hardware-lock-elision"] }
serde = { version = "1.0.229", features = ["derive"] }
rio-graphics = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442" }
rio-grapheme-width = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442" }
# Width tables plus the UAX #29 grapheme segmentation used by mode 2027.
rio-unicode = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442" }
regex-automata = "0.4.16"
cursor-icon = { version = "1.1.0", default-features = false }
smallvec = { version = "1.15.2", default-features = false }
flate2 = "1.1.9"

# Native-only: SIMD UTF-8/base64 (scalar fallbacks on wasm), the PTY stack,
# and the system clipboard.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
corcovado = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", optional = true }
raw-window-handle = { version = "0.6.2", features = ["std"], optional = true }
copypasta = { version = "0.10.2", default-features = false, optional = true }
teletypewriter = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", optional = true }
simdutf = "0.7.0"
# Optional: only pulled in when the embedder wants the app-level renderer
# error variant (font-not-found). Off keeps rio-vt free of sugarloaf.
sugarloaf = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", optional = true }
# Optional windowing types (WindowId / event loop proxy). Off gives a
# standalone `WindowId(u64)`, keeping the core free of the window layer.
rio-window = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# `Instant` backed by performance.now(); std's panics on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_Foundation"] }

[features]
# PTY driver on by default; no renderer, no windowing.
default = ["pty"]
# The PTY event loop (`performer::Machine`). VT-only embedders turn this off.
pty = ["dep:corcovado", "dep:teletypewriter"]
# Expose the app-level `RioErrorType::FontsNotFound` variant (needs a
# sugarloaf font type). Enabled by rio-backend's own `renderer` feature.
renderer = ["dep:sugarloaf"]
# Bridge to rio-window: `From` conversions between the core's `WindowId`
# and `rio_window::window::WindowId`, plus the event-loop proxy listener.
# (Rio's window layer is `rio-window`, a winit fork; hence not "winit".)
rio-window = ["dep:rio-window"]
# System-clipboard backing for the `Clipboard` helper (copypasta). Headless
# embedders that only parse and snapshot never need this; frontends enable it.
clipboard = ["dep:copypasta", "dep:raw-window-handle"]
# Image (sixel/kitty/iTerm2) and glyph protocol decoding. Pulls the `image`
# crate and a font-outline parser. Headless embedders that only parse and
# snapshot never decode images or glyphs, so this stays off by default.
graphics = ["dep:image_rs", "rio-graphics/image", "rio-graphics/glyph"]
x11 = ["clipboard", "copypasta/x11"]
wayland = ["clipboard", "copypasta/wayland"]
wgpu = ["renderer", "dep:sugarloaf", "sugarloaf/wgpu"]

[dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }

[[bench]]
name = "vt_input"
harness = false
