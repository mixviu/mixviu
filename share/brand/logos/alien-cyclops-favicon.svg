<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>Alien Cyclops favicon</title>
<!-- The mascot (alien-cyclops.svg) at a larger scale to fill the icon, with a
     black outline (10 units per side before scaling) under the white ring and
     the #FF0000 eye, so the C stays visible on light browser chrome. Heavier
     than the mascot's 4 px so it survives 16 px. Transparent background. -->
<g transform="translate(256 256) scale(1.36) translate(-256 -256)"><path d="M320.00 382.76A142 142 0 1 0 192.00 382.76" fill="none" stroke="#000000" stroke-width="88" stroke-linecap="round"/><path d="M320.00 382.76A142 142 0 1 0 192.00 382.76" fill="none" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round"/><circle cx="256" cy="256" r="56" fill="#000000"/><circle cx="256" cy="256" r="46" fill="#FF0000"/></g>
</svg>
