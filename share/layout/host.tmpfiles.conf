# Render with the same roots as the service units; apply before starting them.
d @{etc}/blobd 0755 root root -
d @{etc}/indexd 0755 root root -
d @{etc}/maild 0750 root maild -
d @{etc}/webd 0755 root root -
d @{run}/blobd 0750 blobd blobd -
d @{run}/dnsd 0750 dnsd dnsd -
d @{run}/maild 0750 maild maild -
d @{run}/noded 0755 noded noded -
d @{run}/session 0755 mix mix -
d @{run}/webd 0750 webd webd -
d @{var}/blobd 0750 blobd blobd -
d @{var}/dlnad 0755 dlnad dlnad -
d @{var}/dnsd 0750 dnsd dnsd -
d @{var}/hostd 0700 root root -
d @{var}/indexd 0750 indexd indexd -
d @{var}/maild 0750 maild maild -
d @{var}/monitord 0750 monitord monitord -
d @{var}/noded 0750 noded noded -
d @{var}/session 0755 mix mix -
d @{var}/webd 0750 webd webd -
