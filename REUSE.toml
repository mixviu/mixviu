# REUSE-format licence annotations (https://reuse.software/spec/), so every
# file is covered without a per-file header. A file that carries its own SPDX
# header keeps it ("closest" precedence).
version = 1

[[annotations]]
path = ["share/fonts/LiberationSans-*.ttf", "share/fonts/OFL-Liberation.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Corporation", "2012 Red Hat, Inc."]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["share/fonts/NotoSans*.ttf", "share/fonts/OFL-Noto.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["libraries/icons/assets/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = ["provenance/opus-codecs.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Stephen Berry", "2026 restsend.com", "2001-2023 Xiph.Org, Skype Limited, Octasic, Jean-Marc Valin, Timothy B. Terriberry, CSIRO, Gregory Maxwell, Mark Borgerding, Erik de Castro Lopo, Mozilla, Amazon"]
SPDX-License-Identifier = "BSD-3-Clause"
