# REUSE-format licence annotations (https://reuse.software/spec/), so every
# file is covered without a per-file header. A file that carries its own SPDX
# header keeps it ("closest" precedence).
version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["libraries/icons/assets/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"
