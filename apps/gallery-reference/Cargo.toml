[package]
name = "viu-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
viu = { path = "../../libraries/viu", package = "lib-viu" }
bus = { path = "../../libraries/bus" }
serde_json = "=1.0.151"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "sync"] }
