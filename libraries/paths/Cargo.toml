[package]
name = "paths"
description = "Relocatable MixViu roots and logical paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixviu]
component = "paths"
kind = "lib"
layer = "bus"
contract = "none"

[target.'cfg(target_os = "linux")'.dependencies]
# Already workspace-pinned and used by mix; constants only, no C build helper.
libc.workspace = true

[lints.clippy]
mod_module_files = "deny"
