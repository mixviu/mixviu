[package]
name = "viu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
icons = { path = "../icons" }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
mix = { path = "../mix", features = ["regex", "tokio-sleep", "json", "datetime"] }
thumbs.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
unicode-segmentation = "=1.13.3"
scene = { path = "../scene" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "sync"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
tempfile.workspace = true
