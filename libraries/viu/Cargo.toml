[package]
name = "lib-viu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "viu"

[features]
default = ["shell-profile"]
shell-profile = ["mix/json", "mix/regex", "mix/toml", "mix/datetime", "mix/url", "mix/crypto", "mix/http", "mix/sqlite", "mix/ws", "mix/archive"]

[dependencies]
settings = { path = "../settings", default-features = false }
editor = { workspace = true, features = ["mix"] }
editor-model.workspace = true
edit.workspace = true
blake3.workspace = true
base64.workspace = true
sha2.workspace = true
regex.workspace = true
maildoc.workspace = true
buildinfo.workspace = true
action.workspace = true
schemars.workspace = true
cosmic-text.workspace = true
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
uuid.workspace = true
egui_plot.workspace = true
libc.workspace = true
toolkit = { path = "../toolkit", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu_no_default_features"] }
smithay-client-toolkit = "=0.19.2"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
xkbcommon = { version = "0.7", default-features = false }
futures = "0.3"
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
raw-window-handle = "=0.6.2"
wayland-client = { version = "=0.31.15", default-features = false }
files = { path = "../files" }
fontdb = "=0.23.0"
mimedb.workspace = true
macros = { path = "../macros" }
config = { path = "../config" }
design = { path = "../design" }
icons = { path = "../icons" }
bus = { path = "../bus", features = ["native"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
mix = { path = "../mix", package = "lib-mix", features = ["regex", "tokio-sleep", "json", "datetime", "mime", "crypto", "url"] }

thumbs.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "=0.18.1"
unicode-segmentation = "=1.13.3"
scene = { path = "../scene" }
serde_json = "=1.0.154"
serde.workspace = true
reqwest.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "env-filter", "fmt", "registry", "tracing-log"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "macros", "sync"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
editor-model = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[build-dependencies]
buildinfo.workspace = true
