[package]
name = "viu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
buildinfo = { path = "../buildinfo" }
rio-vt = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false, features = ["pty"] }
paths = { path = "../paths" }
fontdb = "=0.23.0"
swash = "0.2.10"
assets.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
zeroize = "1"
teletypewriter = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false }
settings = { path = "../settings", default-features = false }
editor = { workspace = true, features = ["mix"] }
editor-model.workspace = true
edit.workspace = true
blake3.workspace = true
sha2.workspace = true
regex.workspace = true
maildoc.workspace = true
egui_plot.workspace = true
libc.workspace = true
toolkit = { path = "../toolkit", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu_no_default_features"] }
smithay-client-toolkit = "=0.19.2"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
xkbcommon = { version = "0.7", default-features = false }
futures = "0.3"
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
raw-window-handle = "=0.6.2"
wayland-client = { version = "=0.31.15", default-features = false }
files = { path = "../files" }
mimedb.workspace = true
macros = { path = "../macros" }
config = { path = "../config" }
design = { path = "../design" }
icons = { path = "../icons" }
bus = { path = "../bus", features = ["native"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
mix = { path = "../mix", features = ["regex", "tokio-sleep", "json", "datetime", "mime"] }
thumbs.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "=0.18.1"
unicode-segmentation = "=1.13.3"
scene = { path = "../scene" }
serde_json = "=1.0.151"
serde.workspace = true
reqwest.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "env-filter", "fmt", "registry", "tracing-log"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "sync"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
test-broker = { path = "../test-broker" }
egui_kittest.workspace = true
editor-model = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[build-dependencies]
buildinfo = { path = "../buildinfo" }
