# assets: the resolver for a pinned, immutable set of fonts, icons and emoji
# published as `<root>/sets/<id>` behind a `current` link, locked by a
# strict-data manifest with a SHA-256 and a BLAKE3 per file. The core takes
# its search directories from the caller; the default `mix` feature adds
# the MixViu lookup (`mix/assets` under the XDG data directories, then
# `assets` under the share directory `config` resolves), and the `verified`
# feature adds immutable byte reads (`read_verified`) through
# `config::atomic` descriptor-relative opens.
[package]
name = "assets"
description = "Resolver for pinned, verified font, icon and emoji asset sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixviu]
component = "assets"
kind = "lib"
layer = "core"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = ["mix"]
# The MixViu search path. Without it the crate is the generic core only and
# depends on no other MixViu crate but `strict`.
mix = ["verified"]
# Immutable verified byte reads (`AssetSet::read_verified`): every locked
# file captured once through descriptor-relative opens in `config::atomic`.
# Off, the core depends on no other MixViu crate but `strict`.
verified = ["dep:config"]

[dependencies]
# The two locked hashes every file carries; both are checked on `verify`.
blake3 = { version = "=1.8.7" }
sha2 = { version = "=0.10.9" }
hex = { version = "=0.4.3" }
# The `mixos` search path's directories and the `verified` feature's
# descriptor-relative opens (`config::atomic`); optional so the core keeps
# its strict-only dependency set.
config = { path = "../config", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
strict = { path = "../strict" }
thiserror = { version = "=2.0.21" }

[dev-dependencies]
# Tests build and mutate manifests as JSON trees, then write them as strict
# data (or, for the installed layout, as the JSON the installer writes).
serde_json.workspace = true
tempfile = { version = "=3.27.0" }
