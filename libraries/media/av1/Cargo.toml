[package]
name = "media-av1"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["decode-asm"]
decode-asm = ["rav1d/asm"]
asm = ["rav1e/asm", "decode-asm"]

[dependencies]
media-frame = { path = "../frame" }
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"] }
rav1d = { version = "=1.1.1", git = "https://github.com/memorysafety/rav1d", rev = "2e7216c20ac2a75de204d6c8d7268b75a45959b4", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
media-webm = { path = "../webm" }
tempfile.workspace = true

[[example]]
name = "av1enc"
test = true
