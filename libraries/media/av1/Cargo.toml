[package]
name = "media-av1"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["asm"]
asm = ["rav1e/asm", "rav1d/asm"]

[dependencies]
media-frame = { path = "../frame" }
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"] }
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
media-webm = { path = "../webm" }
tempfile.workspace = true

[[example]]
name = "av1enc"
test = true
