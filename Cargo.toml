# MixViu workspace. Every package is a component or a component's private
# crate (AGENTS.md §1–§2); vendor/ holds patched upstreams, several with their
# own [workspace].

[workspace]
resolver = "3"
exclude = ["vendor", "vendor/smithay", "vendor/eframe", "vendor/egui-wgpu", "vendor/calloop", "vendor/input"]
# libs/* includes maildoc and every other shared library component.
members = ["libraries/maildoc","engines/viud/crates/*","libraries/ui","engines/viu","engines/viud","libraries/viu","libraries/theme","libraries/toolkit","libraries/thumbs","libraries/action","libraries/icons","libraries/editor","libraries/editor-model","libraries/macros","libraries/syntax","libraries/inputd-core","libraries/inputd-schema","libraries/expr","libraries/scene","libraries/strict","libraries/mix","libraries/bus","libraries/props","libraries/logging","libraries/config","libraries/buildinfo","libraries/paths","libraries/mimedb","libraries/test-broker","libraries/mesh","libraries/mesh-trust","libraries/mix-shell","engines/mix","engines/mixd","services/noded","libraries/design","libraries/settings","libraries/edit","services/settingsd","services/editd","libraries/mds","services/monitord","services/dnsd","services/dnsd/crates/dns-core","services/blobd","services/hostd","services/mixtrayd","libraries/assets","libraries/daemon","libraries/davproto","libraries/files","services/maild","services/maild/crates/maild-auth","services/maild/crates/maild-bayesian","services/maild/crates/maild-rules","services/webd","services/indexd"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mixviu/mixviu"

# The engine crates still carry warnings; a clippy-clean pass is its own change.
[workspace.lints.rust]
warnings = "allow"

[workspace.dependencies]
maildoc = { path = "libraries/maildoc" }
input = { path = "vendor/input" }
calloop = { path = "vendor/calloop" }
inputd-core = { path = "libraries/inputd-core" }
world = { path = "engines/viud/crates/world" }
ui = { path = "libraries/ui" }
surfaces = { path = "engines/viud/crates/surfaces" }
slots = { path = "engines/viud/crates/slots" }
render-gles = { path = "engines/viud/crates/render-gles" }
policy = { path = "engines/viud/crates/policy" }
motion = { path = "engines/viud/crates/motion" }
model = { path = "engines/viud/crates/model" }
ledger = { path = "engines/viud/crates/ledger" }
kms = { path = "engines/viud/crates/kms" }
graphics = { path = "engines/viud/crates/graphics" }
testkit = { path = "engines/viud/crates/testkit" }
seat = { path = "engines/viud/crates/seat" }
scenegraph = { path = "engines/viud/crates/scenegraph" }
recorder = { path = "engines/viud/crates/recorder" }
policy-host = { path = "engines/viud/crates/policy-host" }
outputs = { path = "engines/viud/crates/outputs" }
headless = { path = "engines/viud/crates/headless" }
nested = { path = "engines/viud/crates/nested" }
native = { path = "engines/viud/crates/native" }
frames = { path = "engines/viud/crates/frames" }
edges = { path = "engines/viud/crates/edges" }
x11-wm = { path = "engines/viud/crates/x11-wm" }
screencopy = { path = "engines/viud/crates/screencopy" }
protocols = { path = "engines/viud/crates/protocols" }
effects = { path = "engines/viud/crates/effects" }
drivers = { path = "engines/viud/crates/drivers" }
dispatcher = { path = "engines/viud/crates/dispatcher" }
decor = { path = "engines/viud/crates/decor" }
comp-service = { path = "engines/viud/crates/comp-service" }
comp-model = { path = "engines/viud/crates/comp-model" }
smithay = { path = "vendor/smithay", version = "0.7.0", default-features = false, features = ["backend_drm", "backend_egl", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "drm", "gbm", "renderer_gl", "renderer_multi", "renderer_pixman", "use_system_lib", "wayland-egl", "wayland_frontend", "xwayland"] }
toolkit = { path = "libraries/toolkit" }
thumbs = { path = "libraries/thumbs" }
syntax = { path = "libraries/syntax" }
macros = { path = "libraries/macros" }
editor-model = { path = "libraries/editor-model", default-features = false }
editor = { path = "libraries/editor" }
icons = { path = "libraries/icons" }
action = { path = "libraries/action" }
theme = { path = "libraries/theme" }
ui-surface = { path = "engines/viud/crates/ui-surface" }
async-stream = "0.3"
async-trait = "0.1"
bcrypt = "0.16"
directories = "6"
glob = "0.3"
hickory-resolver = { version = "0.26.1", features = ["tokio", "system-config"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
linkify = "0.10"
mail-auth = { version = "=0.11.0", default-features = false, features = ["ring", "generate", "arc"] }
mail-builder = "0.4"
mail-parser = "=0.11.5"
quick-xml = "0.41"
regex = "1"
rpassword = "7"
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
smtp-proto = "0.2"
spamlite = { git = "https://github.com/markc/spamlite", rev = "e4cda94713f696414550f414feaea4e8d6c4355e", default-features = false }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
unicode-normalization = "0.1"
webpki-roots = "0.26"
x509-parser = "0.18"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
arc-swap = "1"
base64 = "0.22"
# `pure`: Rust SIMD only, no C or assembly (tools/foreign.conf.mix). Same
# hashes; only the AVX-512 path is lost.
blake3 = { version = "1", features = ["pure"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
# hostd: WireGuard public keys (X25519); already in the lock through ed25519-dalek.
curve25519-dalek = "4.1"
futures-util = "=0.3.34"
hex = "0.4"
hmac = "0.12"
libc = { version = "=0.2.189" }
mimalloc = { version = "0.1", default-features = false }
metrics = "0.24"
metrics-util = "0.18"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
# email's JMAP transport: rustls only (no native-tls); the account's own CA
# is added per client, never a global invalid-certificate acceptance.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustc-hash = "2"
# indexd's embedding stack (_plan/2026-10-20-indexd-port.md D3–D5): crates.io
# candle, not git. 0.10.2's nomic_bert.rs is byte-identical to the predecessor's pin
# 09b9145. candle-core itself requires tokenizers 0.22 with `onig` on every
# non-wasm target, so indexd matches it exactly, giving ONE tokenizers. onig (C)
# stays because candle needs it. Without `esaxx_fast`, esaxx-rs builds without C++.
candle-core = { version = "=0.10.2" }
candle-nn = { version = "=0.10.2" }
candle-transformers = { version = "=0.10.2" }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
sqlite-vec = { version = "=0.1.9" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
# serde_json must never gain `preserve_order` (indexmap): frozen wire formats
# rely on BTreeMap key order.
serde_json = { version = "=1.0.151" }
schemars = { version = "=1.2.3" }
sha2 = { version = "=0.10.9" }
tempfile = "=3.27.0"
thiserror = { version = "=2.0.20" }
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "=0.26.2"
tracing = { version = "=0.1.44" }
tracing-appender = "0.2"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["fast-rng", "serde", "v7"] }
# D-Bus for the session portal (services/portald). Pinned to the version the
# lock already resolves; the tokio backend only, no async-io or blocking API.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

# GUI (AGENTS.md §4.1): egui on wgpu from crates.io, one version of each.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wayland", "wgpu"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
egui_plot = { version = "=0.38.0", default-features = false }
egui_kittest = { version = "=0.37.0", features = ["snapshot", "wgpu"] }
fluent-bundle = "=0.15.3"
futures = "=0.3.34"
# Window captures over the Bus (toolkit::drive); the version image already uses.
png = "=0.18.1"
# toolkit::markdown: the parser only (no `html` feature), the version Mix's
# markdown feature already locks.
pulldown-cmark = { version = "=0.12.2", default-features = false }

# Shared libraries (libs/).
buildinfo = { path = "libraries/buildinfo" }
bus = { path = "libraries/bus", default-features = false }
config = { path = "libraries/config" }
# The Mix lexer is opt-in (ced enables it); a plain-text editor does not need Mix.
expr = { path = "libraries/expr" }
logging = { path = "libraries/logging" }
mix = { path = "libraries/mix", package = "lib-mix" }
props = { path = "libraries/props" }
scene = { path = "libraries/scene" }
strict = { path = "libraries/strict" }
mimedb = { path = "libraries/mimedb" }
design = { path = "libraries/design" }
edit = { path = "libraries/edit" }
settings = { path = "libraries/settings" }
assets = { path = "libraries/assets" }
davproto = { path = "libraries/davproto" }
daemon = { path = "libraries/daemon" }
files = { path = "libraries/files" }

# The compositor (engines/viud): smithay with the compositor's hooks and patches
# (vendor/smithay/PATCHES.md), and wgpu on the GL backend only, sharing
# smithay's EGL context.
wgpu = { version = "=30.0.1", default-features = false, features = ["gles", "parking_lot", "std", "wgsl"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
bindgen = "=0.71.1"
bitflags = "=2.13.1"
cc = "=1.4.3"
crossbeam-channel = "=0.5.16"
drm-ffi = "=0.9.1"
gbm = "=0.18.0"
glow = "=0.17.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pkg-config = "=0.3.34"
pollster = "=1.0.1"
xcursor = "=0.3.11"
# Flexbox layout of Mix Scenes in viu.
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
# Scene icons: SVG rasterised at draw size (the version egui_extras already uses).
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
# Window-title shaping in decor (embedded faces only, so no fontconfig).
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
libpulse-binding = "=2.30.1"
mpris = "=2.1.0"
wayland-backend = "=0.3.17"
wayland-scanner = "=0.31.11"

# viud private crates (engines/viud/crates/).

# inputd's pure crates (services/inputd/crates/): viud's user-key layer
# reuses the classifier and the latch.

# noded private crates (services/noded/crates/).
mesh = { path = "libraries/mesh" }
mesh-trust = { path = "libraries/mesh-trust" }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
calloop = { path = "vendor/calloop" }
input = { path = "vendor/input" }
# dirs-sys without option-ext (MixViu vendor/README.md).
dirs-sys = { path = "vendor/dirs-sys" }
# maild's parser nesting safeguard (MixViu vendor/mail-parser/PATCHES.md).
mail-parser = { path = "vendor/mail-parser" }

[patch."https://github.com/raphamorim/rio"]
teletypewriter = { path = "vendor/teletypewriter" }
rio-vt = { path = "vendor/rio-vt" }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
split-debuginfo = "packed"
strip = "symbols"

[profile.release-fast]
codegen-units = 16
inherits = "release"
lto = false

[workspace.lints.clippy]
mod_module_files = "deny"
