[workspace]
members = ["libraries/expr", "libraries/strict", "libraries/scene", "libraries/mix", "libraries/paths", "libraries/mimedb", "libraries/viu", "libraries/bus", "libraries/config", "engines/viu", "apps/gallery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mixviu/mixviu"

[workspace.lints.clippy]
mod_module_files = "deny"

[workspace.dependencies]
config = { path = "libraries/config" }
anyhow = "1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
thiserror = "=2.0.20"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "=3.27.0"
libc = "0.2"
futures-util = "=0.3.34"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
mimedb = { path = "libraries/mimedb" }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
