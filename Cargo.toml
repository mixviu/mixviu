[workspace]
members = ["libraries/expr", "libraries/strict", "libraries/scene", "libraries/mix", "libraries/paths", "libraries/mimedb", "libraries/viu", "engines/viu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mixviu/mixviu"

[workspace.lints.clippy]
mod_module_files = "deny"

[workspace.dependencies]
libc = "0.2"
futures-util = "=0.3.34"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
mimedb = { path = "libraries/mimedb" }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
