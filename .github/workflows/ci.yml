# Merge-queue rehearsal (lab only, never lands; plan in the private hub).
# Red when lab/RED exists in the tested tree. Runs on PRs and on merge-queue
# candidates; the lab-* context cannot satisfy main's required checks.
name: ci

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  lab-ci-ok:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lab marker
        run: test ! -e lab/RED
