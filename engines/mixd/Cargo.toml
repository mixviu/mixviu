[package]
name = "mixd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The service engine: the Mix service profile plus headless personalities, chosen by argv[0]"

# Lab (mixviu engine-split decision, 2026-11-06). Inverts MixOS cli/system:
# no `mix` personality; `mixd run`/`mixd serve` run scripts under the service
# profile. Personalities (noded, maild, ...) join as optional deps later.

[lints.clippy]
mod_module_files = "deny"

[[bin]]
name = "mixd"
path = "src/main.rs"

[features]
# Headless personalities, chosen by argv[0] (a `noded` symlink to mixd runs
# the broker). Each is its component's library `main`.
default = ["noded", "settingsd", "editd", "monitord", "dnsd", "blobd", "hostd", "mixtrayd", "maild", "webd", "indexd"]
maild = ["dep:maild"]
webd = ["dep:webd"]
indexd = ["dep:indexd"]
monitord = ["dep:monitord"]
dnsd = ["dep:dnsd"]
blobd = ["dep:blobd"]
hostd = ["dep:hostd"]
mixtrayd = ["dep:mixtrayd"]
noded = ["dep:noded"]
settingsd = ["dep:settingsd"]
editd = ["dep:editd"]

[dependencies]
mix-shell = { path = "../mix-shell", features = ["service-builtins", "serve"] }
noded = { path = "../../services/noded", optional = true }
settingsd = { path = "../../services/settingsd", optional = true }
editd = { path = "../../services/editd", optional = true }
monitord = { path = "../../services/monitord", optional = true }
dnsd = { path = "../../services/dnsd", optional = true }
blobd = { path = "../../services/blobd", optional = true }
hostd = { path = "../../services/hostd", optional = true }
mixtrayd = { path = "../../services/mixtrayd", optional = true }
maild = { path = "../../services/maild", optional = true }
webd = { path = "../../services/webd", optional = true }
indexd = { path = "../../services/indexd", optional = true }
mimalloc.workspace = true
