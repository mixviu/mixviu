[package]
name = "screencopy"
description = "wlr-screencopy v3 for viud: protocol state on the real Dispatch, damage-driven copies serviced by the backends after they render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixviu]
component = "viud"
kind = "service"
layer = "desktop"
contract = "none"

[lints.rust]
warnings = "allow"

[lints.clippy]
mod_module_files = "deny"

[features]
# Fault injection for owning-crate tests; absent from normal viud builds.
test-support = []

[dependencies]
comp-model = { workspace = true }
dispatcher = { workspace = true }
ledger = { workspace = true }
graphics = { workspace = true }
model = { workspace = true }
protocols = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
smithay = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }
wayland-client = { version = "=0.31.15" }
