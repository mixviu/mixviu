[package]
name = "headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "viud render-node backend with a virtual output and no seat"

[package.metadata.mixviu]
component = "viud"
kind = "service"
layer = "desktop"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[features]
# Forced source ordering for integration fixtures; never enabled by a backend.
test-support = []

[dependencies]
paths = { path = "../../../../libraries/paths" }
recorder.workspace = true
comp-model.workspace = true
ledger.workspace = true
smithay = { workspace = true }
model = { workspace = true }
world = { workspace = true }
frames = { workspace = true }
outputs = { workspace = true }
render-gles = { workspace = true }
protocols = { workspace = true }
graphics = { workspace = true }
scenegraph = { workspace = true }
slots = { workspace = true }
decor = { workspace = true }
screencopy = { workspace = true }

[dev-dependencies]
wayland-protocols-wlr = { workspace = true, features = ["client"] }
# Enable the fixture in test builds (also when the workspace builds viud).
headless = { path = ".", features = ["test-support"] }
screencopy = { workspace = true, features = ["test-support"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode"] }
crc32fast = "=1.5.4"
wayland-client = { version = "=0.31.15" }
libc = { workspace = true }
serde_json = { workspace = true }
testkit = { workspace = true }
wayland-protocols = { version = "=0.32.13", features = ["client"] }
