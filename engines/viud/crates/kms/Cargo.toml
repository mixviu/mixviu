[package]
name = "kms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mixviu]
component = "viud"
kind = "service"
layer = "desktop"
contract = "none"

[lints.rust]
warnings = "allow"

[lints.clippy]
mod_module_files = "deny"

[features]
flip-estimate = []
mode-synthesize = ["dep:drm-ffi"]
modifier-fallback = []
native-scanout = []
timing-predict = []
timing-throttle = []

[dependencies]
model = { workspace = true }
render-gles = { workspace = true }
drm-ffi = { workspace = true, optional = true }
libc = { workspace = true }
smithay = { workspace = true }

[dev-dependencies]
world.workspace = true
drivers.workspace = true
