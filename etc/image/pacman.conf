# SPDX-License-Identifier: MIT OR Apache-2.0
# The one pinned package snapshot for every MixViu image (tools/image.mix).
# Every Server is the same dated Arch Linux Archive day; tools/image.mix
# refuses a live mirror or two different days. Bump the date in one commit,
# all repos together. Signatures are required and checked against the
# building host's pacman keyring.
#
# NoExtract here applies to every kind. tools/image.mix adds the kind's own
# NoExtract lines (etc/image/packages.conf.mix) under [options].

[options]
Architecture = x86_64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required
ParallelDownloads = 8
NoExtract = usr/share/locale/* usr/share/doc/* usr/share/man/* usr/share/info/*
NoExtract = usr/share/gtk-doc/* usr/share/help/*

[core]
Server = https://archive.archlinux.org/repos/2026/11/06/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/11/06/$repo/os/$arch
