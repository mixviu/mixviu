[package]
name = "noded"
description = "Native ABP broker, session authority and mesh router"
version = "0.18.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixviu]
component = "noded"
kind = "service"
layer = "core"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

# The daemon is a library, so the mixd engine can run it as its `noded`
# personality (argv[0]); src/main.rs
# is the standalone development binary. Doc comments here were never
# doctests.
[lib]
doctest = false

[dependencies]
logging.workspace = true
paths = { path = "../../libraries/paths" }
bus = { workspace = true, features = ["native"] }
config.workspace = true
props = { workspace = true, features = ["bus"] }
mesh.workspace = true
tokio-rustls.workspace = true
zeroize.workspace = true
mesh-trust.workspace = true
buildinfo.workspace = true
anyhow.workspace = true
axum.workspace = true
arc-swap.workspace = true
base64.workspace = true
blake3.workspace = true
datetime.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
libc.workspace = true
mimalloc.workspace = true
notify.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = "0.35"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
buildinfo.workspace = true

[dev-dependencies]
mix.workspace = true
mix-shell = { path = "../../libraries/mix-shell", features = ["serve"] }
log = "0.4"
tracing-log = "0.2"
test-broker = { path = "../../libraries/test-broker" }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
