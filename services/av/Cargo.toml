[package]
name = "av"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Offline media timeline executor"

[package.metadata.mixviu]
component = "av"
kind = "cli"
layer = "core"
contract = "none"
profiles = ["base"]

[[bin]]
name = "av"
path = "src/main.rs"

[dependencies]
media-audio = { path = "../../libraries/media/audio" }
media-av1 = { path = "../../libraries/media/av1", features = ["asm"] }
media-frame = { path = "../../libraries/media/frame" }
media-vfl = { path = "../../libraries/media/vfl" }
media-webm = { path = "../../libraries/media/webm" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true

[lints]
workspace = true
