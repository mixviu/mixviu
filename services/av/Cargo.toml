[package]
name = "av"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Offline media timeline executor"

[package.metadata.mixviu]
component = "av"
kind = "cli"
layer = "core"
contract = "none"
profiles = ["base"]

[[bin]]
name = "av"
path = "src/main.rs"

[dependencies]
media-audio = { path = "../../libraries/media/audio" }
media-av1 = { path = "../../libraries/media/av1", features = ["asm"] }
media-webm = { path = "../../libraries/media/webm" }
media-opus = { path = "../../libraries/media/opus" }
serde_json.workspace = true
hound = "=3.5.1"
png = "=0.18.1"
md-5 = "=0.10.6"

media-frame = { path = "../../libraries/media/frame" }
media-vfl = { path = "../../libraries/media/vfl" }
serde.workspace = true

libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
